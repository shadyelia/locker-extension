<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked — Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #1a1d2e 0%, #161929 50%, #12152a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 24px;
    }

    /* Ambient glow in background */
    body::before {
      content: '';
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(124, 58, 237, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(167, 139, 250, 0.08),
        0 24px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Lock icon with pulsing glow */
    .lock-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.5);
      margin-bottom: 24px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); }
      50%       { box-shadow: 0 0 0 14px rgba(124, 58, 237, 0); }
    }

    .lock-wrap svg {
      width: 34px;
      height: 34px;
      color: #fff;
      stroke: currentColor;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(167, 139, 250, 0.15);
      border: 1px solid rgba(167, 139, 250, 0.3);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.4px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .site-name {
      color: #c4b5fd;
    }

    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.58);
      line-height: 1.6;
      max-width: 340px;
      margin: 0 auto 28px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 auto 24px;
    }

    .tip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.42);
    }

    .tip svg {
      width: 14px;
      height: 14px;
      color: rgba(167, 139, 250, 0.7);
      stroke: currentColor;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .footer svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="lock-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Blocked by Locker
    </div>

    <h1>This site is <span class="site-name">temporarily blocked</span></h1>

    <p>You set this site as off-limits. Stay focused — you can do it. Check back once your lock period ends.</p>

    <div class="divider"></div>

    <div class="tip">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Open the Locker extension to manage your blocked sites
    </div>
  </div>

  <div class="footer">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Locker — Focus without distractions
  </div>

</body>
</html>
